name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Sync (locked)
        run: uv sync --locked
      - name: Lint
        run: |
          # Whole repo, not just src+tests: tools/ and deploy/ drifted out of
          # compliance precisely because CI never looked at them (2026-07-27).
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Test
        run: uv run --locked pytest
